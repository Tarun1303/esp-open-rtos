<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fourth Law · Codex Workspace</title>
<style>
:root{color-scheme:dark;--bg:#070a0f;--card:#101620;--line:#253142;--text:#e8f0fa;--muted:#8392a6;--cyan:#70dcff;--green:#6ee7b7;--bad:#ff8d83}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#18263a,var(--bg) 45%);color:var(--text);font:14px Inter,system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{border-right:1px solid var(--line);padding:18px;overflow:auto}main{display:flex;flex-direction:column;min-width:0}.brand{font-weight:700;letter-spacing:.03em}.sub{color:var(--muted);font-size:11px;margin:5px 0 20px}.new{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#152131;color:var(--text);cursor:pointer}.sessions{margin-top:15px}.session{padding:10px;border:1px solid transparent;border-radius:9px;cursor:pointer;margin:4px 0}.session:hover,.session.active{border-color:var(--line);background:#101924}.session b{font-size:12px}.session span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.state{font-size:12px;color:var(--green)}.feed{flex:1;overflow:auto;padding:22px max(22px,calc((100% - 900px)/2));}.empty{color:var(--muted);text-align:center;margin-top:25vh}.msg{max-width:800px;margin:0 0 18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;white-space:pre-wrap;line-height:1.55}.msg.user{margin-left:auto;background:#162235}.msg.assistant{background:var(--card)}.meta{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}.composer{border-top:1px solid var(--line);padding:14px max(22px,calc((100% - 900px)/2));display:flex;gap:9px}.composer textarea{flex:1;min-height:50px;max-height:140px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#0d131c;color:var(--text);padding:12px}.composer button,.interrupt{border:1px solid var(--line);border-radius:11px;background:#173044;color:var(--text);padding:0 18px;cursor:pointer}.interrupt{padding:7px 10px;background:#291d22;color:#ffb8b1}.dialog{position:fixed;inset:0;background:#000b;display:none;place-items:center}.dialog.show{display:grid}.box{width:min(520px,90vw);background:#0f1620;border:1px solid var(--line);border-radius:16px;padding:20px}.box select,.box textarea{width:100%;margin:8px 0 13px;padding:11px;background:#090e15;color:var(--text);border:1px solid var(--line);border-radius:10px}.box textarea{min-height:130px}.row{display:flex;gap:8px;justify-content:flex-end}.err{color:var(--bad);font-size:11px}.event{font-size:10px;color:var(--muted);padding:4px 0}@media(max-width:720px){.app{grid-template-columns:1fr}aside{display:none}}
</style></head><body><div class="app"><aside><div class="brand">FOURTH LAW · CODEX</div><div class="sub">Persistent isolated coding threads</div><button class="new" onclick="openNew()">+ New coding thread</button><div class="sessions" id="sessions"></div></aside><main><div class="top"><div><b id="title">Codex workspace</b><div class="sub" id="role">Choose or create a thread</div></div><div><span class="state" id="state">ready</span> <button class="interrupt" onclick="stop()">Interrupt</button></div></div><div class="feed" id="feed"><div class="empty">Each role edits only its own Git worktree.<br>Deployment remains behind the existing verified release gate.</div></div><div class="composer"><textarea id="prompt" placeholder="Give the coding instruction…"></textarea><button onclick="send()">Send</button></div></main></div>
<div class="dialog" id="dialog"><div class="box"><h3>Start a coding thread</h3><label>Workspace role</label><select id="newRole"><option value="runtime">Runtime architecture</option><option value="control-room">Control Room UI/API</option><option value="execution">Integration & release safety</option><option value="efficiency">Efficiency, memory & context</option></select><label>First instruction</label><textarea id="first" placeholder="Describe the change and acceptance criteria…"></textarea><div class="err" id="err"></div><div class="row"><button class="new" onclick="closeNew()">Cancel</button><button class="new" onclick="create()">Start</button></div></div></div>
<script>
let sessions=[],current=null,source=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/control-room';throw new Error('Pair in the main Control Room first')}if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function refresh(){const d=await api('/control-room/api/codex/sessions');sessions=d.sessions||[];$('#sessions').innerHTML=sessions.map(s=>`<div class="session ${current?.id===s.id?'active':''}" onclick="openSession('${s.id}')"><b>${esc(s.role)}</b><span>${esc(s.status)} · ${new Date(s.updated_at*1000).toLocaleString()}</span></div>`).join('')||'<div class="sub">No coding threads yet.</div>'}
function openNew(){$('#dialog').classList.add('show');$('#first').focus()}function closeNew(){$('#dialog').classList.remove('show')}
async function create(){const message=$('#first').value.trim();if(message.length<3)return;$('#err').textContent='';try{const s=await api('/control-room/api/codex/sessions',{method:'POST',body:JSON.stringify({role:$('#newRole').value,message})});closeNew();$('#first').value='';await refresh();openSession(s.id)}catch(e){$('#err').textContent=e.message}}
async function openSession(id){if(source)source.close();current=await api('/control-room/api/codex/sessions/'+id);render();source=new EventSource('/control-room/api/codex/stream/'+id);source.addEventListener('snapshot',e=>{current=JSON.parse(e.data);render()});source.onerror=()=>{$('#state').textContent='reconnecting'};refresh()}
function render(){if(!current)return;$('#title').textContent=current.role+' coding thread';$('#role').textContent=current.model+' · persistent thread '+(current.thread_id||'starting');$('#state').textContent=current.status;const messages=current.messages||[];const events=(current.events||[]).slice(-8);$('#feed').innerHTML=messages.map(m=>`<div class="msg ${m.role}"><div class="meta">${esc(m.role)}${m.phase?' · '+esc(m.phase):''}</div>${esc(m.text)}</div>`).join('')+(events.length?`<div>${events.map(e=>`<div class="event">${new Date(e.ts*1000).toLocaleTimeString()} · ${esc(e.summary)}</div>`).join('')}</div>`:'');$('#feed').scrollTop=$('#feed').scrollHeight}
async function send(){const message=$('#prompt').value.trim();if(!message||!current){if(!current)openNew();return}$('#prompt').value='';try{await api('/control-room/api/codex/sessions/'+current.id+'/messages',{method:'POST',body:JSON.stringify({message})})}catch(e){alert(e.message)}}
async function stop(){if(current)await api('/control-room/api/codex/sessions/'+current.id+'/interrupt',{method:'POST'})}
$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});refresh().then(()=>{if(sessions[0])openSession(sessions[0].id)});
</script></body></html>
