<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fourth Law Control Room</title><style>body{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#eef2f7;margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.card{background:#13171d;border:1px solid #262d36;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,textarea,button{font:inherit;border-radius:10px;border:1px solid #343d49;background:#0e1116;color:#fff;padding:11px}textarea{width:100%;box-sizing:border-box;min-height:110px}button{cursor:pointer;background:#1e2630}.ok{color:#70e6a2}.bad{color:#ff8f8f}.muted{color:#9aa7b5}.node{margin-left:18px;border-left:2px solid #2c3440;padding:8px 0 8px 14px}.small{font-size:12px}.status{font-weight:700;text-transform:uppercase;font-size:12px}</style></head><body><div class="wrap"><h1>Fourth Law — Recursive Control Room</h1><div class="card"><div class="grid"><div><b>Admin Token</b><br><input id="token" type="password" placeholder="Stored only in this browser"></div><div><b>Supervisor</b><div id="sup">—</div></div><div><b>Architecture</b><div id="arch">4-way recursive</div></div><div><b>Active Nodes</b><div id="active">—</div></div></div></div><div class="card"><h3>Launch Mission</h3><textarea id="goal" placeholder="Describe the mission. Root always divides into exactly four modules."></textarea><div style="margin-top:8px"><label>Max depth <input id="depth" type="number" value="3" min="1" max="4" style="width:70px"></label> <button onclick="launch()">Launch</button></div><div id="launchmsg" class="muted"></div></div><div class="card"><h3>Human Decisions</h3><div id="decisions" class="muted">None</div></div><div class="card"><h3>Missions</h3><div id="jobs">—</div></div><div class="card" id="treecard" style="display:none"><h3>Agent Tree</h3><div id="tree"></div></div></div><script>const $=id=>document.getElementById(id);$('token').value=localStorage.fl_token||'';$('token').onchange=()=>localStorage.fl_token=$('token').value;async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-Admin-Token':$('token').value,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function refresh(){try{const s=await api('/control-state');$('sup').innerHTML=`<span class="ok">${esc(s.supervisor.status)}</span><br><span class="small muted">${esc(s.supervisor.model)}</span>`;$('arch').innerHTML=`4 → 16 → 64<br><span class="small muted">depth ${s.architecture.default_max_depth}, cap ${s.architecture.max_agents}</span>`;$('active').textContent=s.active_nodes;$('decisions').innerHTML=s.pending_decisions.length?s.pending_decisions.map(d=>`<div class="card"><b>${esc(d.question)}</b><div class="small muted">${esc(d.reason)}</div><textarea id="ans_${d.id}" style="min-height:60px"></textarea><button onclick="answer('${d.id}')">Answer</button></div>`).join(''):'<span class="muted">None — Supervisor has everything it needs.</span>';$('jobs').innerHTML=s.jobs.length?s.jobs.map(j=>`<div class="card" onclick="showJob('${j.id}')" style="cursor:pointer"><b>${esc(j.goal)}</b><br><span class="status">${esc(j.status)}</span><span class="small muted"> · agents ${j.agents_created}/${j.agent_budget} · depth ${j.max_depth}</span></div>`).join(''):'<span class="muted">No missions yet.</span>'}catch(e){$('sup').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}function renderNode(n){return `<div class="node"><b>${esc(n.name)}</b> <span class="status">${esc(n.status)}</span><div class="small muted">${esc(n.role)} · depth ${n.depth} · ${esc(n.mode||'planning')}</div><div>${esc(n.goal)}</div>${n.children?.map(renderNode).join('')||''}</div>`}async function showJob(id){const j=await api('/task/'+id);$('treecard').style.display='block';$('tree').innerHTML=renderNode(j.root)}async function launch(){try{const r=await api('/task',{method:'POST',body:JSON.stringify({goal:$('goal').value,context:'',max_depth:Number($('depth').value)})});$('launchmsg').innerHTML=`<span class="ok">Queued ${esc(r.job_id)} · budget ${r.agent_budget}</span>`;$('goal').value='';refresh()}catch(e){$('launchmsg').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}async function answer(id){await api('/decisions/'+id+'/answer',{method:'POST',body:JSON.stringify({answer:$('ans_'+id).value})});refresh()}refresh();setInterval(refresh,4000);</script></body></html>
